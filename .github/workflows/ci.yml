name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated test class names to run instead of the full suite (Full_Tests only)'
        required: false
        default: ''

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8

jobs:
  JDKxx_Matrix:
    strategy:
      fail-fast: false
      matrix:
        isMain:
          - ${{ contains(github.ref, 'main') }}
        java: [ 25 ]
        os: [ ubuntu-latest ]
    name: JDK${{ matrix.java }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
    - name: Build OpenSSL and Tomcat Native for the OpenSSL test variants
      run: |
        set -euo pipefail
        sudo apt-get update -q
        sudo apt-get install -y -q libapr1-dev
        cd "$RUNNER_TEMP"
        OSSL=3.5.8
        curl -fsSL -o openssl-$OSSL.tar.gz https://github.com/openssl/openssl/releases/download/openssl-$OSSL/openssl-$OSSL.tar.gz
        curl -fsSL -o openssl-$OSSL.tar.gz.sha256 https://github.com/openssl/openssl/releases/download/openssl-$OSSL/openssl-$OSSL.tar.gz.sha256
        echo "$(awk '{print $1}' openssl-$OSSL.tar.gz.sha256)  openssl-$OSSL.tar.gz" | sha256sum -c -
        tar xzf openssl-$OSSL.tar.gz
        (cd openssl-$OSSL && ./Configure shared no-tests no-docs --prefix="$RUNNER_TEMP/openssl" --libdir=lib > /dev/null && make -s -j"$(nproc)" > /dev/null && make -s install_sw > /dev/null)
        TCN=1.3.9
        curl -fsSL -o tcnative.tar.gz https://archive.apache.org/dist/tomcat/tomcat-connectors/native/$TCN/source/tomcat-native-$TCN-src.tar.gz
        echo "d9394494ef41e7210bab85b34dd39ece18029587496682fbc5ea334692c1229ee3196b5981bab224f9ca2305e745e569343f43c9e7274fff8ae1950882cc3afb  tcnative.tar.gz" | sha512sum -c -
        tar xzf tcnative.tar.gz
        (cd tomcat-native-$TCN-src/native && ./configure --with-apr=/usr/bin/apr-1-config --with-java-home="$JAVA_HOME" --with-ssl="$RUNNER_TEMP/openssl" --prefix="$RUNNER_TEMP/tcnative" > /dev/null && make -s -j"$(nproc)" > /dev/null && make -s install > /dev/null)
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/openssl/lib:$RUNNER_TEMP/tcnative/lib" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/openssl/bin" >> "$GITHUB_PATH"
        LD_LIBRARY_PATH="$RUNNER_TEMP/openssl/lib" "$RUNNER_TEMP/openssl/bin/openssl" version
        ls -l "$RUNNER_TEMP/tcnative/lib"
    - name: Build
      run: |
        ant -noinput echoproperties deploy embed test-nio test-status
      env:
        ANT_OPTS: -Dtest.openssl.exists=false -Dtest.excludePerformance=true -Dtest.profile=smoke

    - name: Upload logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: JDK${{ matrix.java }}-${{ matrix.os }}-logs
        path: |
          hs_err_*.log
          output/build/logs/TEST*.txt
        retention-days: 7

  Release_Jar:
    name: Release jar (tomcat-embed-core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: temurin
    - name: Build embed jars
      run: |
        set -euo pipefail
        ant -version
        java -version
        ant -noinput -Drelease.java.version=99 embed-jars
        mkdir -p seal-dist
        cp output/embed/tomcat-embed-core.jar seal-dist/tomcat-embed-core-9.0.122.jar
        unzip -l seal-dist/tomcat-embed-core-9.0.122.jar | tail -1
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: tomcat-embed-core-jar
        path: seal-dist/tomcat-embed-core-9.0.122.jar
        if-no-files-found: error

  Full_Tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: catalina
            pattern: 'org/apache/catalina/**/Test*.java'
          - leg: coyote
            pattern: 'org/apache/coyote/**/Test*.java'
          - leg: tomcat
            pattern: 'org/apache/tomcat/**/Test*.java'
          - leg: javax-el-jasper-juli-naming-util
            pattern: 'javax/**/Test*.java,org/apache/el/**/Test*.java,org/apache/jasper/**/Test*.java,org/apache/juli/**/Test*.java,org/apache/naming/**/Test*.java,util/**/Test*.java'
    name: Full tests NIO (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: temurin
    - name: Build OpenSSL and Tomcat Native for the OpenSSL test variants
      run: |
        set -euo pipefail
        sudo apt-get update -q
        sudo apt-get install -y -q libapr1-dev
        cd "$RUNNER_TEMP"
        OSSL=3.5.8
        curl -fsSL -o openssl-$OSSL.tar.gz https://github.com/openssl/openssl/releases/download/openssl-$OSSL/openssl-$OSSL.tar.gz
        curl -fsSL -o openssl-$OSSL.tar.gz.sha256 https://github.com/openssl/openssl/releases/download/openssl-$OSSL/openssl-$OSSL.tar.gz.sha256
        echo "$(awk '{print $1}' openssl-$OSSL.tar.gz.sha256)  openssl-$OSSL.tar.gz" | sha256sum -c -
        tar xzf openssl-$OSSL.tar.gz
        (cd openssl-$OSSL && ./Configure shared no-tests no-docs --prefix="$RUNNER_TEMP/openssl" --libdir=lib > /dev/null && make -s -j"$(nproc)" > /dev/null && make -s install_sw > /dev/null)
        TCN=1.3.9
        curl -fsSL -o tcnative.tar.gz https://archive.apache.org/dist/tomcat/tomcat-connectors/native/$TCN/source/tomcat-native-$TCN-src.tar.gz
        echo "d9394494ef41e7210bab85b34dd39ece18029587496682fbc5ea334692c1229ee3196b5981bab224f9ca2305e745e569343f43c9e7274fff8ae1950882cc3afb  tcnative.tar.gz" | sha512sum -c -
        tar xzf tcnative.tar.gz
        (cd tomcat-native-$TCN-src/native && ./configure --with-apr=/usr/bin/apr-1-config --with-java-home="$JAVA_HOME" --with-ssl="$RUNNER_TEMP/openssl" --prefix="$RUNNER_TEMP/tcnative" > /dev/null && make -s -j"$(nproc)" > /dev/null && make -s install > /dev/null)
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/openssl/lib:$RUNNER_TEMP/tcnative/lib" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/openssl/bin" >> "$GITHUB_PATH"
        LD_LIBRARY_PATH="$RUNNER_TEMP/openssl/lib" "$RUNNER_TEMP/openssl/bin/openssl" version
        ls -l "$RUNNER_TEMP/tcnative/lib"
    - name: Run tests
      run: |
        set -euo pipefail
        PATTERN='${{ matrix.pattern }}'
        FILTER='${{ inputs.test-filter }}'
        if [ -n "$FILTER" ]; then
          if [ "${{ matrix.leg }}" != "catalina" ]; then
            echo "test-filter set: the selected tests run in the catalina leg only"
            exit 0
          fi
          PATTERN=$(for t in $FILTER; do printf '**/%s.java,' "$t"; done)
          PATTERN=${PATTERN%,}
        fi
        echo "Running test.name=$PATTERN"
        ant -noinput test-nio -Dtest.name="$PATTERN" -Dtest.threads=4 -Dtest.excludePerformance=true -Dtest.apr.loc="$RUNNER_TEMP/tcnative/lib" -Dtest.openssl.path="$RUNNER_TEMP/openssl/bin/openssl" test-status
      env:
        ANT_OPTS: -Xmx2g
    - name: Test summary
      if: ${{ !cancelled() }}
      run: |
        set -uo pipefail
        cd output/build/logs 2>/dev/null || { echo "No test logs directory"; exit 0; }
        ls TEST-*.txt > /dev/null 2>&1 || { echo "No test report files"; exit 0; }
        awk '
          FNR == 1 { suite = FILENAME; sub(/^TEST-/, "", suite); sub(/\.txt$/, "", suite); nsuites++; last = "" }
          /^Tests run: / { l = $0; gsub(",", "", l); split(l, a, " "); t += a[3]; f += a[5]; e += a[7]; s += a[9]; hdr[FILENAME] = 1 }
          /^Testcase: / { tc++; last = $2 }
          /^\tSKIPPED/ { r = $0; sub(/^\tSKIPPED:? ?/, "", r); if (r == "") r = "(no message)"; printf "SKIPPED %s :: %s -- reason: %s\n", suite, last, r; grp[suite " -- " r]++ }
          /^\tFAILED/ { printf "FAILED %s :: %s\n", suite, last }
          /^\tCaused an ERROR/ { printf "ERROR %s :: %s\n", suite, last }
          END {
            for (k in grp) printf "SKIP-GROUP %d x %s\n", grp[k], k
            printf "TOTALS: suites=%d tests=%d passed=%d failures=%d errors=%d skipped=%d (testcase lines=%d)\n", nsuites, t, t - f - e - s, f, e, s, tc
          }
        ' TEST-*.txt
        for fn in TEST-*.txt; do grep -aq "^Tests run: " "$fn" || echo "NOTE: $fn has no Tests run header; its testcases are counted in testcase lines above"; done
